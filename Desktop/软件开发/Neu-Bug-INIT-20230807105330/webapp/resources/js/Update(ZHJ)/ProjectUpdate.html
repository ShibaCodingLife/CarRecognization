<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目修改界面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f7;
        }
        .container {
            width: 50%;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 15px;
        }
        th, td {
            text-align: left;
            padding: 10px 15px;
        }
        th {
            font-weight: 500;
            color: #555;
            font-size: 16px;
        }
        td {
            background-color: #f9f9f9;
            border-radius: 8px;
        }
        input {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007aff;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #007aff;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: block;
            margin: 20px auto 0;
        }
        button:hover {
            background-color: #005eb8;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>项目修改界面</h1>
    <table>
        <tr>
            <th>字段</th>
            <th>输入</th>
        </tr>
        <tr>
            <td>项目名称</td>
            <td><input type="text" id="projectName" name="projectName" placeholder="请输入项目名称"></td>
        </tr>
        <tr>
            <td>项目关键字</td>
            <td><input type="text" id="projectKeywords" name="projectKeywords" placeholder="请输入项目关键字"></td>
        </tr>
        <tr>
            <td>项目描述信息</td>
            <td><input type="text" id="projectDescription" name="projectDescription" placeholder="请输入项目描述信息"></td>
        </tr>
        <tr>
            <td>项目负责人</td>
            <td><input type="text" id="projectOwner" name="projectOwner" placeholder="请输入项目负责人"></td>
        </tr>
    </table>
    <button type="button" onclick="submitForm()">确认修改</button>
</div>

<script>
    function submitForm() {
        const projectName = document.getElementById('projectName').value;
        const projectKeywords = document.getElementById('projectKeywords').value;
        const projectDescription = document.getElementById('projectDescription').value;
        const projectOwner = document.getElementById('projectOwner').value;

        console.log('项目名称:', projectName);
        console.log('项目关键字:', projectKeywords);
        console.log('项目描述信息:', projectDescription);
        console.log('项目负责人:', projectOwner);

        alert('修改已提交！');
    }
</script>
</body>
</html>
